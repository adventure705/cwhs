<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Language Resources | ConnectingWarmHearts</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <style>
    :root {
      --cream:#efebe2;
      --blue:#1c14d9;
      --ink:#151515;
      --muted:#68645f;
      --card:#fffdf8;
      --line:rgba(28,20,217,.14);
      --shadow:0 18px 45px rgba(28,20,217,.12);
      --radius:26px;
    }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body {
      margin:0;
      font-family: 'Poppins', system-ui, -apple-system, sans-serif;
      background:radial-gradient(circle at top left, #fff9ea 0, var(--cream) 34%, #f8f3ea 100%);
      color:var(--ink);
    }
    .wrap { width:min(1180px, calc(100% - 32px)); margin:0 auto; }
    header { padding:44px 0 24px; }
    .hero {
      background:linear-gradient(135deg, #1612d3 0%, #2520ee 58%, #443ff8 100%);
      border:1px solid rgba(255,255,255,.28);
      border-radius:32px;
      padding:34px;
      box-shadow:0 22px 54px rgba(22,18,211,.28);
      color:#fff;
      text-align:center;
    }
    .eyebrow { color:rgba(255,255,255,.78); font-size:13px; font-weight:800; letter-spacing:.12em; text-transform:uppercase; }
    h1 { margin:8px 0 10px; font-size:clamp(30px, 5vw, 58px); line-height:1.02; letter-spacing:-.04em; }
    .hero h1 {
      color:#fff;
      text-shadow:0 3px 14px rgba(0,0,0,.22);
    }
    .hero p { margin:0 auto; color:rgba(255,255,255,.86); font-size:16px; line-height:1.75; max-width:760px; }
    
    .grid {
      display:grid;
      grid-template-columns:repeat(4, minmax(0, 1fr));
      gap:24px;
      padding:22px 0 60px;
    }
    .card {
      background:var(--card);
      border:1px solid rgba(22,18,211,.12);
      border-radius:var(--radius);
      overflow:hidden;
      box-shadow:0 12px 32px rgba(26,24,18,.08);
      transition:.2s ease;
      display:flex;
      flex-direction:column;
    }
    .card:hover { transform:translateY(-5px); box-shadow:0 20px 45px rgba(28,20,217,.16); }
    
    /* CSS Thumbnail styling */
    .thumb {
      position:relative;
      aspect-ratio:4/3;
      background:linear-gradient(135deg, #e0e7ff 0%, #ede9fe 100%);
      display:flex;
      align-items:center;
      justify-content:center;
      overflow:hidden;
      border-bottom: 1px solid rgba(0,0,0,0.05);
    }
    
    .thumb-bg-decor {
      position: absolute;
      width: 150%;
      height: 150%;
      background: radial-gradient(circle, rgba(255,255,255,0.8) 0%, rgba(255,255,255,0) 70%);
      opacity: 0.6;
    }

    .thumb-content {
      position: relative;
      z-index: 2;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 12px;
    }

    .thumb-emoji {
      font-size: 3.5rem;
      line-height: 1;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.15));
    }

    .thumb-lang {
      font-family: 'Poppins', sans-serif;
      font-weight: 800;
      font-size: 1.6rem;
      color: var(--blue);
      letter-spacing: -0.02em;
      text-shadow: 0 2px 10px rgba(255,255,255,0.8);
      text-align: center;
    }

    .body { padding:24px; flex-grow:1; display:flex; flex-direction:column; align-items:center; text-align:center; }
    .tag { color:var(--blue); font-size:12px; font-weight:800; text-transform:uppercase; letter-spacing:.08em; }
    h2 { margin:8px 0 20px; font-size:20px; line-height:1.2; letter-spacing:-.02em; }
    
    .open-btn {
      display:inline-flex;
      align-items:center;
      justify-content:center;
      margin-top:auto;
      width:100%;
      border-radius:16px;
      background:linear-gradient(135deg, #1c14d9 0%, #4f46e5 100%);
      color:#fff;
      text-decoration:none;
      padding:14px;
      font-weight:800;
      font-size:14px;
      box-shadow:0 8px 20px rgba(28,20,217,.25);
      transition:transform .18s ease, box-shadow .18s ease;
    }
    .open-btn:hover {
      transform:translateY(-2px);
      box-shadow:0 12px 28px rgba(28,20,217,.35);
    }
    
    footer { text-align:center; padding:0 0 34px; color:var(--blue); font-size:13px; font-weight:800; letter-spacing:.02em; }
    
    @media (max-width:1024px) { .grid { grid-template-columns:repeat(3, minmax(0, 1fr)); } }
    @media (max-width:768px) { .grid { grid-template-columns:repeat(2, minmax(0, 1fr)); } }
    @media (max-width:480px) {
      .wrap { width:min(100% - 24px, 1180px); }
      header { padding-top:20px; }
      .hero { padding:24px 20px; border-radius:24px; }
      .grid { grid-template-columns:1fr; gap:16px; }
      .thumb-emoji { font-size: 3rem; }
      .thumb-lang { font-size: 1.4rem; }
    }
  </style>
</head>
<body>
  <header class="wrap">
    <section class="hero">
      <div class="eyebrow">Language Resources</div>
      <h1>Choose your language.</h1>
      <p>View the translated links for your reveal script. Find your preferred language below.</p>
    </section>
  </header>

  <main class="wrap">
    <section class="grid" id="gallery"></section>
  </main>

  <footer>connectingwarmhearts</footer>

  <script>
    // EDIT HERE: Update the csvLink with your actual URLs.
    const languages = [
      {
        id: "english",
        language: "English",
        nativeName: "English",
        emoji: "🇺🇸",
        csvLink: "#link-to-english"
      },
      {
        id: "spanish",
        language: "Spanish",
        nativeName: "Español",
        emoji: "🇪🇸",
        csvLink: "#link-to-spanish"
      },
      {
        id: "french",
        language: "French",
        nativeName: "Français",
        emoji: "🇫🇷",
        csvLink: "#link-to-french"
      },
      {
        id: "german",
        language: "German",
        nativeName: "Deutsch",
        emoji: "🇩🇪",
        csvLink: "#link-to-german"
      },
      {
        id: "italian",
        language: "Italian",
        nativeName: "Italiano",
        emoji: "🇮🇹",
        csvLink: "#link-to-italian"
      },
      {
        id: "portuguese",
        language: "Portuguese",
        nativeName: "Português",
        emoji: "🇵🇹",
        csvLink: "#link-to-portuguese"
      },
      {
        id: "korean",
        language: "Korean",
        nativeName: "한국어",
        emoji: "🇰🇷",
        csvLink: "#link-to-korean"
      },
      {
        id: "japanese",
        language: "Japanese",
        nativeName: "日本語",
        emoji: "🇯🇵",
        csvLink: "#link-to-japanese"
      }
    ];

    const gallery = document.getElementById('gallery');

    function renderLanguages() {
      gallery.innerHTML = languages.map(lang => `
        <article class="card">
          <div class="thumb">
            <div class="thumb-bg-decor"></div>
            <div class="thumb-content">
              <span class="thumb-emoji">${lang.emoji}</span>
              <span class="thumb-lang">${lang.language}</span>
            </div>
          </div>
          <div class="body">
            <div class="tag">${lang.language}</div>
            <h2>${lang.nativeName}</h2>
            <!-- Remove 'download' attribute to open the link normally -->
            <a href="${lang.csvLink}" class="open-btn" target="_blank" rel="noopener noreferrer">Open Link →</a>
          </div>
        </article>
      `).join('');
    }

    renderLanguages();
  </script>
</body>
</html>
